name: Deploy database (Neon PostgreSQL)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations in order
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGOPTIONS: "-c client_min_messages=warning"
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing secret DATABASE_URL in Settings > Secrets and variables > Actions"; exit 1
          fi
          for f in $(ls migrations/*.sql | sort -V); do
            echo ">> Applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Check data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -c "SELECT 'buildings' AS \"table\", COUNT(*) FROM building UNION ALL SELECT 'programs', COUNT(*) FROM program UNION ALL SELECT 'places', COUNT(*) FROM place UNION ALL SELECT 'faq', COUNT(*) FROM faq UNION ALL SELECT 'users', COUNT(*) FROM app_user;"
