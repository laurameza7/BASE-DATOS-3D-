name: Desplegar base de datos (Neon PostgreSQL)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Aplicar migraciones en orden
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Falta el secreto DATABASE_URL en Settings > Secrets and variables > Actions"; exit 1
          fi
          for f in $(ls migrations/*.sql | sort -V); do
            echo ">> Aplicando $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Verificar datos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -c "SELECT 'edificios' AS tabla, COUNT(*) FROM edificio UNION ALL SELECT 'programas', COUNT(*) FROM programa UNION ALL SELECT 'lugares', COUNT(*) FROM lugar UNION ALL SELECT 'faqs', COUNT(*) FROM pregunta_frecuente;"


