name: Test migrations (PostgreSQL 16)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ucc
          POSTGRES_PASSWORD: ucc
          POSTGRES_DB: ucc_pasto3d
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U ucc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ucc:ucc@localhost:5432/ucc_pasto3d
      PGOPTIONS: "-c client_min_messages=warning"   # hides the "already exists, skipping" notices
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations on an empty database
        run: |
          for f in $(ls migrations/*.sql | sort -V); do
            echo ">> $f"; psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Apply them again (they must be idempotent, the deployment does this)
        run: |
          for f in $(ls migrations/*.sql | sort -V); do
            echo ">> $f"; psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Check data, integrity and security
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/verify.sql
